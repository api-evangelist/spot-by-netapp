aid: spot-by-netapp
name: Spot by NetApp
description: >-
  Spot by NetApp (formerly Spot by Flexera, originally Spotinst) is a cloud infrastructure optimization platform
  providing automated cost optimization, scaling, and intelligent management for cloud workloads across AWS, Azure, and
  GCP. The Spot platform includes Elastigroup for intelligent auto-scaling using Spot instances, Ocean for Kubernetes
  and container cost optimization, Stateful Nodes for stateful workloads, EMR Scaler for Hadoop workloads, and Ocean CD
  for progressive delivery. The platform delivers FinOps capabilities including rightsizing recommendations, cost
  analysis, and cloud spend visibility.
